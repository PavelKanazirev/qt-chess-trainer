name: CI
on:
    push:
      branches: [main]
    pull_request:
    
jobs:
  build-test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: ./scripts/install-deps.sh

  diagrams:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: ./scripts/install-deps.sh --docs
      - name: Check local links in the documentation
        run: python3 scripts/check-doc-links.py
      - run: plantuml -tsvg -o ../rendered docs/diagrams/*.puml
      - uses: actions/upload-artifact@v4
        with:
          name: diagrams
          path: docs/rendered

  admin-gui:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install system libraries for Qt
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3
      - run: pip install -r tools/admin_gui/requirements.txt
      - name: Run admin GUI tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest tools/admin_gui/tests -v
